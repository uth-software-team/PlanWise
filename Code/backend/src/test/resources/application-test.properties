# Test profile: always use an isolated in-memory H2 database,
# even when a local Code/backend/.env points to PostgreSQL.
spring.datasource.url=jdbc:h2:mem:planwise_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
