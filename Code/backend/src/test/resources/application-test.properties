# Test profile: always use an isolated in-memory H2 database,
# even when a local Code/backend/.env points to PostgreSQL.
spring.datasource.url=jdbc:h2:mem:planwise_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Migrations target PostgreSQL (partial indexes, TIMESTAMPTZ); H2 tests use Hibernate create-drop instead.
spring.flyway.enabled=false

# Fixed, test-only JWT key (not a real secret) so tests never depend on a local .env.
app.jwt.secret=test-only-jwt-secret-not-for-production-use-0123456789
# Pinned so a local .env (e.g. JWT_EXPIRATION_MINUTES=60) cannot change test results.
app.jwt.expiration-minutes=1440
# Always FakeAiClient in tests, even when a local .env sets GEMINI_API_KEY: tests never call Gemini.
app.ai.gemini.api-key=
