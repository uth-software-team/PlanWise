spring.application.name=planwise
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# Load local secrets/config from Code/backend/.env (KEY=VALUE) when present.
# Missing file is ignored -> falls back to the defaults below (H2 in-memory).
# Real OS environment variables still take precedence over values in .env.
spring.config.import=optional:file:.env[.properties]

# ---------- Database ----------
# Default: in-memory H2 for local dev. Override via env for PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:planwise;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only validates it.
# Never use update/create here: schema changes go through a new versioned migration.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- JWT ----------
# HS256 secret, REQUIRED (no default). Must be at least 32 bytes (UTF-8).
# Set JWT_SECRET in Code/backend/.env (scripts/setup-dev.sh generates one) or as an OS env var.
# The app refuses to start when it is missing or too short (see SecurityConfig).
app.jwt.secret=${JWT_SECRET:}
# Access token lifetime in minutes (team decision CG-04: 24h for the MVP, no refresh token).
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
