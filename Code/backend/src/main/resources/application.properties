spring.application.name=planwise
server.servlet.context-path=/api

# ---------- Database ----------
# Default: in-memory H2 for local dev. Override via env for PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:planwise;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# ---------- JWT ----------
# HS256 secret, must be at least 32 bytes. ALWAYS override in production.
app.jwt.secret=${JWT_SECRET:planwise-dev-secret-key-change-me-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
