plugins {
	id 'java'
	id 'eclipse'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'group16'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.h2database:h2'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	// PostgreSQL tests (@Tag("pg"), run by ./gradlew pgTest). Versions come from the Spring Boot BOM.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Default tests run on H2 and need no Docker; PostgreSQL tests and the OpenAPI snapshot export are excluded here.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'pg', 'openapi'
	}
}

// PostgreSQL tests on a throwaway Testcontainers database (requires Docker): ./gradlew pgTest
tasks.register('pgTest', Test) {
	description = 'Runs @Tag("pg") tests against PostgreSQL via Testcontainers (requires Docker).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'pg'
	}
	shouldRunAfter tasks.named('test')
}

// F-05 contract snapshot (owner TV1): ./gradlew exportOpenApi. Not wired into build/check, so normal builds never
// rewrite it. H2 test profile only; no Docker, database or .env needed.
def openApiSnapshot = layout.projectDirectory.file('../../docs/api/openapi-v1.json')
tasks.register('exportOpenApi', Test) {
	description = 'Writes the OpenAPI contract snapshot to docs/api/openapi-v1.json.'
	group = 'documentation'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'openapi'
	}
	systemProperty 'openapi.snapshot.path', openApiSnapshot.asFile.absolutePath
	outputs.file(openApiSnapshot)
}
